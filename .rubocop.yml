# Omakase Ruby styling for Rails
# inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot
require:
  - 'test_prof/rubocop'

Bundler:
  Enabled: true
Gemspec:
  Enabled: true
Layout:
  Enabled: true
Lint:
  Enabled: true
Metrics:
  Enabled: true
Naming:
  Enabled: true
Performance:
  Enabled: true
  Exclude:
    - "test/**/*"
Rails:
  Enabled: true
Security:
  Enabled: true
Style:
  Enabled: true

AllCops:
  NewCops: enable
  Exclude:
    - bin/**/*
    - config/environments/**
    - coverage/**/*
    - db/schema.rb
    - lib/tasks/*.rake
    - log/**/*
    - nginx/**/*
    - public/**/*
    - storage/**/*
    - swagger/**/*
    - tmp/**/*
    - vendor/**/*
    - .git/**/*
  SuggestExtensions: true
  TargetRubyVersion: 3.4
  TargetRailsVersion: 8.1

Bundler/OrderedGems:
  Enabled: false

Style/Documentation:
  Enabled: false

RSpecRails/InferredSpecType:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

Layout/HashAlignment:
  EnforcedHashRocketStyle: table

Rails/SkipsModelValidations:
  Exclude:
    - 'spec/**/*'

Layout/ClassStructure:
  Enabled: true
  Categories:
    module_inclusion:
      - include
      - prepend
      - extend
    attribute_macros:
      - attr
      - attr_accessor
      - attr_reader
      - attr_writer
      - attribute
      - serialize
      - encrypts
      - enum
    associations:
      - belongs_to
      - has_one
      - has_many
      - has_and_belongs_to_many
      - has_one_attached
      - has_many_attached
    scopes:
      - default_scope
      - scope
    validations:
      - validate
      - validates
      - validates_each
      - validates_with
    delegations:
      - delegate
    callbacks:
      - before_validation
      - after_validation
      - before_save
      - around_save
      - before_create
      - around_create
      - after_create
      - before_update
      - around_update
      - after_update
      - after_save
      - before_destroy
      - around_destroy
      - after_destroy
      - after_commit
      - after_rollback
      - after_initialize
      - after_find
      - after_touch
    protected_attribute_macros:
      - attr
      - attr_accessor
      - attr_reader
      - attr_writer
    private_attribute_macros:
      - attr
      - attr_accessor
      - attr_reader
      - attr_writer
  ExpectedOrder:
    - module_inclusion
    - constants
    - attribute_macros
    - associations
    - scopes
    - validations
    - delegations
    - callbacks
    - public_class_methods
    - initializer
    - public_methods
    - protected_attribute_macros
    - protected_methods
    - private_attribute_macros
    - private_delegate
    - private_methods
